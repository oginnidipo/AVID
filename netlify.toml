# Netlify deployment configuration.
# Cloudflare Pages users: this file is ignored; public/_headers covers headers
# there, and the build command below is the same. See docs/HANDOVER.md §3.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Marks this as the real site: enables search-engine indexing and a real
  # robots.txt. Leave it unset anywhere that is not the public domain.
  SITE_ENV = "production"

# Astro emits dist/404.html; Netlify serves it automatically for unmatched
# paths on a static site, so no catch-all redirect is needed.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"

[[headers]]
  for = "/_assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
